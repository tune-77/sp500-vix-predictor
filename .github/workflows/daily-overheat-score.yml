name: Daily Overheat Score Update

on:
  schedule:
    # 毎日 日本時間 午前9時 (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write # グラフをリポジトリに保存するために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance matplotlib

      - name: Run overheat score script
        run: python overheat_score.py

      - name: Commit and Push graph
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add overheat_score.png
          # 変更がある場合のみコミット
          git diff --quiet && git diff --staged --quiet || git commit -m "Update overheat score graph [skip ci]"
          git push origin main
